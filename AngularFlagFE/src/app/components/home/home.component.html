<div class="container">
  <h1 class="page-title">World Flags</h1>

  <div class="grid">
    <div class="flag-card"
         *ngFor="let country of countries"
         (click)="viewDetails(country.name)">

      <img [src]="country.flag" alt="{{ country.name }} flag" />
      <p class="country-name">{{ country.name }}</p>
    </div>
  </div>
</div>
